# Tiny Tapeout project information
project:
  title:        "8-bit Loadable Counter"
  author:       "Lalit"
  discord:      ""
  description:  "8-bit up counter with enable and parallel load"
  language:     "Verilog"
  clock_hz:     10000000      # 10 MHz; any reasonable value is fine

  tiles: "1x1"

  top_module:  "tt_um_counter"   # must match the module name in project.v

  source_files:
    - "project.v"

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_counter"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "count_en"
  ui[1]: "load"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "count[0]"
  uo[1]: "count[1]"
  uo[2]: "count[2]"
  uo[3]: "count[3]"
  uo[4]: "count[4]"
  uo[5]: "count[5]"
  uo[6]: "count[6]"
  uo[7]: "count[7]"

  # Bidirectional pins (used as inputs for the load value)
  uio[0]: "load_val[0]"
  uio[1]: "load_val[1]"
  uio[2]: "load_val[2]"
  uio[3]: "load_val[3]"
  uio[4]: "load_val[4]"
  uio[5]: "load_val[5]"
  uio[6]: "load_val[6]"
  uio[7]: "load_val[7]"

# Do not change!
yaml_version: 6
